services:
  # ------------------------------------
  # Contenedor PHP / Laravel
  # ------------------------------------
  php:
    build:
      context: ./airbnb-backend
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./airbnb-backend:/var/www/html
      - vendor_data:/var/www/html/vendor
      # - storage_data:/var/www/html/storage
    expose:
      - "9000"
    depends_on:
      - postgres
      - mongo

  # ------------------------------------
  # PostgreSQL con persistencia
  # ------------------------------------
  postgres:
    image: postgres:18
    container_name: postgres18
    restart: unless-stopped
    environment:
      POSTGRES_DB: airbnb
      POSTGRES_USER: airbnb
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  # ------------------------------------
  # Frontend React
  # ------------------------------------
  frontend:
    build:
      context: ./airbnb-frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./airbnb-frontend:/app:cached
      - /app/node_modules
    ports:
      - "5174:5173"
    command: ["npm", "run", "dev", "--", "--host"]
    depends_on:
      - php
      - postgres

  # ------------------------------------
  # Nginx para Laravel
  # ------------------------------------
  nginx:
    image: nginx:1.29.3
    container_name: nginx_server
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./airbnb-backend:/var/www/html:delegated
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # ------------------------------------
  # Pgadmin para PostgreSQL
  # ------------------------------------
  pgadmin:
    image: dpage/pgadmin4:9.10.0
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ------------------------------------
  # MongoDB
  # ------------------------------------
  mongo:
    image: mongo:7.0
    container_name: mongo_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: airbnb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ------------------------------------
  # Mongo Express para MongoDB
  # ------------------------------------
  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo_express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    depends_on:
      - mongo

# ------------------------------------
# Volúmenes persistentes
# ------------------------------------
volumes:
  pgdata:
  pgadmin_data:
  # storage_data:
  vendor_data:
  mongo_data:

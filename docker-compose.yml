services:
  # PostgreSQL
  postgres:
    image: postgres:15
    container_name: airbnb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airbnb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Backend Laravel
  backend:
    build:
      context: ./airbnb-backend
      dockerfile: Dockerfile
    container_name: airbnb_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      APP_NAME: Airbnb
      APP_ENV: local
      APP_DEBUG: true
      APP_KEY: base64:w30qWQOXWs2rH/iFJYVp5VpdEkvfgpXUznHZ6wpd/0o=
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: airbnb
      DB_USERNAME: postgres
      DB_PASSWORD: root
      SANCTUM_STATEFUL_DOMAINS: localhost:5173
      SESSION_DOMAIN: localhost
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: kevinalejandroangulolopez@gmail.com
      MAIL_PASSWORD: cymyplmvmyhqxscl
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: kevinalejandroangulolopez@gmail.com
      MAIL_FROM_NAME: Airbnb

  # Frontend React
  frontend:
    build:
      context: ./airbnb-frontend
      dockerfile: Dockerfile
    container_name: airbnb_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # PgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: airbnb_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
services:
  # ------------------------------------
  # PostgreSQL
  # ------------------------------------
  postgres:
    image: postgres:15
    container_name: postgres_airbnb
    restart: unless-stopped
    environment:
      POSTGRES_DB: airbnb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ------------------------------------
  # Backend Laravel
  # ------------------------------------
  backend:
    build:
      context: ./airbnb-backend
      dockerfile: Dockerfile
    container_name: airbnb_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: airbnb
      DB_USERNAME: postgres
      DB_PASSWORD: root
      APP_KEY: base64:2fl+Lkgacg6OUQcnmHtb3Q1IDl8pNhH1WR7+mGfP5yc=
      APP_ENV: local
      APP_DEBUG: true

  # ------------------------------------
  # Frontend React
  # ------------------------------------
  frontend:
    build:
      context: ./airbnb-frontend
      dockerfile: Dockerfile
    container_name: airbnb_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # ------------------------------------
  # PgAdmin
  # ------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_airbnb
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
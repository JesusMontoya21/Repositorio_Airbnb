services:
  # ------------------------------------
  # Contenedor PHP / Laravel
  # ------------------------------------
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    expose:
      - "9000"
    depends_on:
      - postgres

  # ------------------------------------
  # PostgreSQL con persistencia
  # ------------------------------------
  postgres:
    image: postgres:18
    container_name: postgres18
    restart: unless-stopped
    environment:
      POSTGRES_DB: airbnb
      POSTGRES_USER: airbnb
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  # ------------------------------------
  # Frontend React
  # ------------------------------------
  frontend:
    build:
      context: ./airbnb-frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./airbnb-frontend:/app
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host"]

  # ------------------------------------
  # Nginx para Laravel
  # ------------------------------------
  nginx:
    image: nginx:1.29.3
    container_name: nginx_server
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # ------------------------------------
  # Pgadmin para PostgreSQL
  # ------------------------------------
  pgadmin:
    image: dpage/pgadmin4:9.10.0
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

# Volumen persistente para la base de datos
volumes:
  pgdata:
